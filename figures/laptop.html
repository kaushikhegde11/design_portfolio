<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Landing Figures Demo</title>
<style>:root{--paper:#FAFAF8;--accent:#2B4CFF;--ink:#15171C;--muted:#5C6070;--rule:#E3E5EE;color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--paper:#10152B;--accent:#6C8CFF;--ink:#F1F2F8;--muted:#8890B0;--rule:#262D4D;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#10152B;--accent:#6C8CFF;--ink:#F1F2F8;--muted:#8890B0;--rule:#262D4D;color-scheme:dark}

.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

/* hairline-anatomy figures on a host page: grey shaded faces, every line in
   the host's accent colour, light and dark. Put class="hla-fig iso" on the
   figure's canvas; the host runtime sets [data-dark] from the page's theme.
   The host provides --paper, --accent and --ink (or overrides --hla-paper,
   --hla-line and --hla-ink directly). Load after the kit's ISO_CSS. */
.hla-fig.iso{
  --hla-paper:var(--paper,#FAFAF8);--hla-line:var(--accent,#2B4CFF);--hla-ink:var(--ink,#15171C);
  --anatomy-page:var(--hla-paper);--anatomy-card:var(--hla-paper);--anatomy-text:var(--hla-ink);
  --anatomy-paper:var(--hla-paper);--anatomy-face:var(--hla-paper);
  --anatomy-top:color-mix(in srgb,var(--hla-paper) 96%,#fff);
  --anatomy-shade-0:color-mix(in srgb,var(--hla-paper) 80%,var(--hla-ink));
  --anatomy-shade-1:color-mix(in srgb,var(--hla-paper) 86%,var(--hla-ink));
  --anatomy-shade-2:color-mix(in srgb,var(--hla-paper) 91%,var(--hla-ink));
  --anatomy-shade-3:color-mix(in srgb,var(--hla-paper) 96%,var(--hla-ink));
  --anatomy-lit-top:color-mix(in srgb,var(--hla-line) 12%,var(--hla-paper));
  --anatomy-lit-shade:color-mix(in srgb,var(--hla-line) 20%,var(--hla-paper));
  --anatomy-hi:var(--hla-line);
  --anatomy-mid:color-mix(in srgb,var(--hla-line) 80%,var(--hla-paper));
  --anatomy-lo:color-mix(in srgb,var(--hla-line) 52%,var(--hla-paper));
  --anatomy-faint:color-mix(in srgb,var(--hla-line) 30%,var(--hla-paper));
  --anatomy-lit:var(--hla-line);
  --anatomy-dot:color-mix(in srgb,var(--hla-line) 75%,var(--hla-paper));
  --anatomy-halo:var(--hla-ink);--anatomy-halo-opacity:.16;
  --anatomy-weight:.7px;
  position:relative;
}
/* dark pages: shading goes toward black, tops toward white */
.hla-fig.iso[data-dark]{
  --anatomy-top:color-mix(in srgb,var(--hla-paper) 90%,#fff);
  --anatomy-shade-0:color-mix(in srgb,var(--hla-paper) 62%,#000);
  --anatomy-shade-1:color-mix(in srgb,var(--hla-paper) 72%,#000);
  --anatomy-shade-2:color-mix(in srgb,var(--hla-paper) 82%,#000);
  --anatomy-shade-3:color-mix(in srgb,var(--hla-paper) 92%,#000);
  --anatomy-halo:#000;--anatomy-halo-opacity:.55;
}
.hla-fig .hla-svg{position:absolute;inset:0;inline-size:100%;block-size:100%;overflow:visible}
.hla-fig .hla-still{position:absolute;inset:0;inline-size:100%;block-size:100%}
/* the WebGL layer: emitted light adds in dark, ink is solved for paper in light */
.hla-fig .hla-gl{position:absolute;inset:0;inline-size:100%;block-size:100%;pointer-events:none;display:block}
.hla-fig[data-dark] .hla-gl{mix-blend-mode:screen}
/* SVG fallbacks for the lights; the shader takes over when it runs */
.hla-fig .hla-led .iso-fill,.hla-fig .hla-led .iso-top,.hla-fig .hla-led .iso-shade{fill:color-mix(in srgb,var(--hla-line) 70%,var(--hla-paper))}
.hla-fig[data-gl] .hla-led .iso-fill,.hla-fig[data-gl] .hla-led .iso-top,.hla-fig[data-gl] .hla-led .iso-shade{fill:color-mix(in srgb,var(--hla-line) 40%,var(--hla-paper))}
.hla-fig .hla-screen{fill:color-mix(in srgb,var(--hla-line) 24%,var(--hla-paper));stroke:none}
.hla-fig[data-gl] .hla-screen{fill:var(--hla-paper)}

*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.lf-bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding-block:12px;padding-inline:16px;border-bottom:1px solid var(--rule);font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.04em;color:var(--muted)}
.lf-bar button{font:inherit;color:var(--accent);background:transparent;border:1px solid var(--accent);border-radius:999px;padding:6px 14px;cursor:pointer}
.lf-bar button:focus-visible,.lf-stage:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
main{max-width:1400px;margin:0 auto;padding-block:40px 64px;padding-inline:16px}
.lf-grid{display:grid;justify-content:center;grid-template-columns:minmax(0,520px);gap:28px}
@media (max-width:1100px){.lf-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.lf-grid{grid-template-columns:1fr}}
.lf-card{margin:0;min-width:0}
.lf-stage{display:grid;place-items:center;aspect-ratio:5/4;padding:clamp(12px,2vw,28px);border-block:1px solid var(--rule);background:var(--paper)}
.lf-canvas{position:relative;inline-size:100%;max-inline-size:520px;aspect-ratio:5/4;touch-action:pan-y;user-select:none}
.lf-card h2{margin:14px 0 4px;font:500 22px/1.2 ui-serif,Georgia,serif;letter-spacing:.06em;text-transform:uppercase}
.lf-card p{margin:0;color:var(--muted);font-size:14px}</style>
<style id="host-embed">html,body{background:transparent!important;margin:0!important;padding:0!important;min-height:0!important;overflow:hidden}
.ap-theme,.ap-bar,.lf-bar,figcaption{display:none!important}
.ap-page,.iso-page{max-width:none!important;width:100%!important;padding:0!important;margin:0!important}
.iso-figure,.hla-figure{margin:0!important}
.iso-plate,.hla-card{border:0!important;background:transparent!important;box-shadow:none!important;padding:0!important;border-radius:0!important}
main{padding:0!important;max-width:none!important}
.lf-grid{grid-template-columns:minmax(0,1fr)!important;gap:0!important}
.lf-stage{border:0!important;background:transparent!important;padding:0!important}
.lf-canvas{max-inline-size:none!important}
</style></head>
<body>
<div class="lf-bar"><span>hairline-anatomy · landing figures · move the pointer near each object; keys work when a card is focused</span><button type="button" id="lf-theme">Switch to dark</button></div>
<main><div class="lf-grid">
<figure class="lf-card"><div class="lf-stage" tabindex="0" data-hla-stage aria-label="Laptop: Move the pointer up and down: the lid leans on its hinge."><div class="lf-canvas hla-fig iso" data-hla-figure="laptop" aria-hidden="true"></div></div><figcaption><h2>Laptop</h2><p>Move the pointer up and down: the lid leans on its hinge.</p></figcaption></figure>
</div></main>
<script>
(function(){
  var b=document.getElementById("lf-theme"), r=document.documentElement;
  function dark(){return r.dataset.theme? r.dataset.theme==="dark" : matchMedia("(prefers-color-scheme: dark)").matches;}
  function label(){b.textContent=dark()?"Switch to light":"Switch to dark";}
  b.addEventListener("click",function(){r.dataset.theme=dark()?"light":"dark";label();});
  label();
})();
</script>

function sideOf(meridian) {

const softOf = (meridian) => meridian.some((point) => Boolean(point[2]));

function outlineOf(meridian, F, P, { steps = stepsFor(Math.max(...meridian.map(([, r]) => r)), 32, 160, scaleOf(P)), fill = "auto", hole = null, rims = "all", smooth: asked = "auto", waist = 0.5, all = null } = {}) {

const signedArea = (points) => points.reduce((sum, [x, y], index) => {

const oriented = (points) => (signedArea(points) < 0 ? [...points].reverse() : points);

const saddleStart = (R, a, angle) => Math.sqrt(Math.max(0, R * R - a * a * Math.cos(angle) ** 2));

function prismOf(F, polygon, s0, s1, P) {

    canvas.toggleAttribute("data-dark", isDark());
    if (view.glow && view.glow.layer) { view.glow.layer.set(view.glow.kind.fixed(fig.glow, themeOf(canvas))); view.drawn = null; }
  };
  paintTheme();

  let first = 0;
  const draw = (now) => {
    const t = value.x;
    const level = view.glow ? Math.round(view.level.x * 1000) / 1000 : 0;
    const key = t.toFixed(4) + "/" + level;
    if (key === view.drawn) return;
    if (view.drawn === null || t.toFixed(4) !== view.drawn.split("/")[0]) for (const g of groups) g.el.innerHTML = g.draw(t);
    view.drawn = key;
    if (view.glow && view.glow.layer) {
      const extra = fig.glow.values ? fig.glow.values(t) : {};
      view.glow.layer.draw({ uLevel: view.level.x, ...extra }, 0.8);
    }
  };
  const loop = live(stage, (dt, now) => {
    const moving = stepS(value, dt);
    let fading = false;
    if (view.glow && view.glow.layer) {
      if (!first) first = now;
      const want = matchMedia("(prefers-reduced-motion: reduce)").matches ? 1 : smooth(0, 1, (now - first) / 900);
      fading = Math.abs(want - view.level.x) > 1e-3;
      view.level.x = want;
    }
    draw(now);
    return moving || fading;
  });
  view.wake = loop.wake;
  view.repaint = () => { paintTheme(); loop.wake(); draw(performance.now()); };
  const aim = (t) => { value.t = Math.min(1, Math.max(0, t)); loop.wake(); };
  pointer(stage, svg, { move: (pt) => aim(fig.target(pt)), leave: () => aim(fig.rest) });
  stage.addEventListener("blur", () => aim(fig.rest));
  stage.addEventListener("keydown", (e) => {
    let to = null;
    if (e.key === "ArrowRight" || e.key === "ArrowUp") to = value.t + (e.shiftKey ? 0.5 : 0.1);
    if (e.key === "ArrowLeft" || e.key === "ArrowDown") to = value.t - (e.shiftKey ? 0.5 : 0.1);
    if (e.key === "Home") to = 0;
    if (e.key === "End") to = 1;
    if (e.key === "Escape") to = fig.rest;
    if (to === null) return;
    e.preventDefault();
    aim(to);
  });
  canvas.dataset.ready = "true";
  views.push(view);
}

const repaintAll = () => views.forEach((v) => v.repaint());
new MutationObserver(repaintAll).observe(root, { attributes: true, attributeFilter: ["data-theme"] });
darkQuery.addEventListener("change", repaintAll);
document.querySelectorAll("[data-hla-figure]").forEach((canvas) => mount(canvas).catch((error) => console.error("hla figure", canvas.dataset.hlaFigure, error)));

return {  };
})();

})();
</script>
